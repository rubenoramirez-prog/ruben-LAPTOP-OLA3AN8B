---
# Production inventory template.
# Replace example addresses and use Ansible Vault for secrets.
all:
  children:
    rhel_servers:
      hosts:
        prod-rhel-01:
          ansible_host: 10.0.10.11
          ansible_user: ansible
        prod-rhel-02:
          ansible_host: 10.0.10.12
          ansible_user: ansible
      vars:
        env: production
        hardening_level: level1
        backup_enabled: true
        backup_configs: true
        compliance_report: true
    web_servers:
      hosts: {}
    db_servers:
      hosts: {}
  vars:
    ansible_python_interpreter: /usr/bin/python3
    ansible_become_method: sudo
