---
# CIS 3.5.x - Configure firewalld

- name: Ensure firewalld is installed (CIS 3.5.1.1)
  package:
    name: firewalld
    state: present
  tags: ['firewalld']

- name: Ensure iptables-services is absent when firewalld is used (CIS 3.5.1.2)
  package:
    name: iptables-services
    state: absent
  tags: ['firewalld']

- name: Ensure firewalld service is enabled and started (CIS 3.5.1.4)
  service:
    name: firewalld
    enabled: true
    state: started
  tags: ['firewalld']

- name: Configure allowed services in firewalld default zone
  firewalld:
    service: "{{ item }}"
    permanent: true
    state: enabled
    zone: "{{ firewalld_config.default_zone }}"
    immediate: true
  loop: "{{ firewalld_config.allowed_services }}"
  tags: ['firewalld']
