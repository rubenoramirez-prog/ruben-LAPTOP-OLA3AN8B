---
# CIS 3.6 - IPv6 Configuration

- name: Disable IPv6 if not explicitly enabled
  sysctl:
    name: "{{ item }}"
    value: '1'
    state: present
    sysctl_set: true
    reload: true
  loop:
    - net.ipv6.conf.all.disable_ipv6
    - net.ipv6.conf.default.disable_ipv6
  when: not ipv6_enabled
  tags: ['ipv6']

- name: Disable IPv6 Router Advertisements
  sysctl:
    name: "{{ item }}"
    value: '0'
    state: present
    sysctl_set: true
    reload: true
  loop:
    - net.ipv6.conf.all.accept_ra
    - net.ipv6.conf.default.accept_ra
  when:
    - ipv6_enabled
    - ipv6_disable_router_advertisements
  tags: ['ipv6']
