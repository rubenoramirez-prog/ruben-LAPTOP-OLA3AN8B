---
# Configure iptables (alternative to firewalld)

- name: Ensure iptables-services is installed
  package:
    name: iptables-services
    state: present
  tags: ['iptables']

- name: Ensure firewalld is stopped and disabled
  service:
    name: firewalld
    enabled: false
    state: stopped
  failed_when: false
  tags: ['iptables']

- name: Set iptables default policies
  iptables:
    chain: "{{ item.chain }}"
    policy: "{{ item.policy }}"
  loop:
    - { chain: 'INPUT', policy: "{{ iptables_rules.input_policy }}" }
    - { chain: 'FORWARD', policy: "{{ iptables_rules.forward_policy }}" }
    - { chain: 'OUTPUT', policy: "{{ iptables_rules.output_policy }}" }
  tags: ['iptables']

- name: Allow loopback input in iptables
  iptables:
    chain: INPUT
    in_interface: lo
    jump: ACCEPT
  when: iptables_rules.loopback_accept
  tags: ['iptables']

- name: Allow established and related connections
  iptables:
    chain: INPUT
    ctstate: ESTABLISHED,RELATED
    jump: ACCEPT
  tags: ['iptables']

- name: Allow incoming SSH
  iptables:
    chain: INPUT
    protocol: tcp
    destination_port: 22
    jump: ACCEPT
  tags: ['iptables']

- name: Ensure iptables service is enabled and started
  service:
    name: iptables
    enabled: true
    state: started
  tags: ['iptables']
