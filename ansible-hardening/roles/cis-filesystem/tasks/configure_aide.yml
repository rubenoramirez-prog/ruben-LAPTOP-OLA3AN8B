---
# CIS 1.3.x - Configure AIDE (File Integrity Monitoring)

- name: Ensure AIDE is installed
  package:
    name: aide
    state: present
  tags: ['aide']

- name: Check if AIDE database exists
  stat:
    path: /var/lib/aide/aide.db.gz
  register: aide_db
  tags: ['aide']

- name: Initialize AIDE database if missing
  command: aide --init
  when: not aide_db.stat.exists
  changed_when: true
  failed_when: false
  tags: ['aide']

- name: Move initialized database into place
  command: cp /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz
  when: not aide_db.stat.exists
  changed_when: true
  failed_when: false
  tags: ['aide']

- name: Schedule periodic AIDE integrity check via cron
  cron:
    name: "CIS AIDE integrity check"
    hour: "{{ aide_cron_schedule.hour }}"
    minute: "{{ aide_cron_schedule.minute }}"
    user: root
    job: "/usr/sbin/aide --check"
  tags: ['aide']
