---
# CIS 1.1.23 - Set sticky bit on world-writable directories
# Prevents unauthorized users from deleting or renaming other users' files

- name: Find world-writable directories missing sticky bit
  shell: |
    df --local -P 2>/dev/null | awk '{if (NR!=1) print $6}' | xargs -I '{}' find '{}' -xdev -type d \( -perm -0002 -a ! -perm -1000 \) 2>/dev/null || true
  args:
    executable: /bin/bash
  register: missing_sticky_bit
  changed_when: false
  tags: ['sticky']

- name: Set sticky bit on world-writable directories
  file:
    path: "{{ item }}"
    mode: 'o+t'
  loop: "{{ missing_sticky_bit.stdout_lines | default([]) }}"
  when: missing_sticky_bit.stdout_lines | length > 0
  tags: ['sticky']
