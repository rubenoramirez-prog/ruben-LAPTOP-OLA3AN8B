---
# CIS 5.1 - Configure Cron and At Permissions

- name: Ensure crond service is enabled and started (CIS 5.1.1)
  service:
    name: crond
    enabled: true
    state: started
  tags: ['cron']

- name: Set permissions on /etc/crontab (CIS 5.1.2)
  file:
    path: /etc/crontab
    owner: root
    group: root
    mode: '0600'
  tags: ['cron']

- name: Set permissions on cron directories (CIS 5.1.3 - 5.1.7)
  file:
    path: "{{ item }}"
    owner: root
    group: root
    mode: '0700'
  loop:
    - /etc/cron.hourly
    - /etc/cron.daily
    - /etc/cron.weekly
    - /etc/cron.monthly
    - /etc/cron.d
  tags: ['cron']

- name: Ensure /etc/cron.deny and /etc/at.deny do not exist (CIS 5.1.8 - 5.1.9)
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/cron.deny
    - /etc/at.deny
  tags: ['cron']

- name: Create /etc/cron.allow and /etc/at.allow with authorized users
  copy:
    dest: "{{ item }}"
    content: "{{ cron_allow_users | join('\n') }}\n"
    owner: root
    group: root
    mode: '0600'
  loop:
    - /etc/cron.allow
    - /etc/at.allow
  tags: ['cron']
