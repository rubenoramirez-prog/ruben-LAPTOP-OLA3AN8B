---
# Compliance report generation task for site.yml

- name: Create reports directory
  file:
    path: /var/log/ansible-hardening-reports
    state: directory
    mode: '0750'
    owner: root
    group: root
  tags: ['report']

- name: Generate summary compliance report
  copy:
    dest: "/var/log/ansible-hardening-reports/compliance_{{ ansible_date_time.iso8601_basic_short }}.txt"
    content: |
      ======================================================
      ENTERPRISE CIS BENCHMARK HARDENING AUDIT REPORT
      ======================================================
      Target Host: {{ ansible_hostname }} ({{ ansible_default_ipv4.address | default('N/A') }})
      Distribution: {{ ansible_distribution }} {{ ansible_distribution_version }}
      Kernel: {{ ansible_kernel }}
      Execution Date: {{ ansible_date_time.iso8601 }}
      Hardening Profile: {{ hardening_level }}

      Roles Executed:
      [X] CIS Filesystem (Partitions, Mount Options, Unused FS, AIDE)
      [X] CIS Base (Bootloader, Process Hardening, SELinux, Banners)
      [X] CIS Services (Time Sync, Insecure Daemons & Clients Masked)
      [X] CIS Network (Kernel Parameters, Protocols, Firewall)
      [X] CIS Logging (Auditd rules, Rsyslog, Journald)
      [X] CIS Access Control (Cron, SSHD, PAM Faillock, User Env)

      Status: SUCCESSFUL APPLICATION
      ======================================================
    mode: '0640'
    owner: root
    group: root
  tags: ['report']
