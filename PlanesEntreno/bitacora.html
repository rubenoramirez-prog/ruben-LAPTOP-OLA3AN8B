<title>Bitácora de Entrenamiento</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: Form entry above, timeline/charts below, data table at end */
:root {
  --navy: #1e3a5f;
  --charcoal: #2a2a2a;
  --amber: #f59e0b;
  --teal: #14b8a6;
  --slate: #64748b;
  --bg: #f8fafc;
  --surface: #ffffff;
  --text: #1e293b;
  --text-muted: #64748b;
  --border: #e2e8f0;

  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --navy: #2e5a8f;
    --charcoal: #1a1a1a;
    --amber: #fbbf24;
    --teal: #2dd4bf;
    --slate: #94a3b8;
    --bg: #0f172a;
    --surface: #1e293b;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --border: #334155;

    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --navy: #2e5a8f;
  --charcoal: #1a1a1a;
  --amber: #fbbf24;
  --teal: #2dd4bf;
  --slate: #94a3b8;
  --bg: #0f172a;
  --surface: #1e293b;
  --text: #f1f5f9;
  --text-muted: #94a3b8;
  --border: #334155;

  color-scheme: dark;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px;
}

h1, h2, h3 {
  font-family: 'Oswald', sans-serif;
  font-weight: 600;
  line-height: 1.2;
  text-wrap: balance;
}

h1 {
  font-size: 2rem;
  color: var(--navy);
  margin-bottom: 8px;
}

.subtitle {
  font-size: 0.95rem;
  color: var(--text-muted);
  margin-bottom: 32px;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 24px;
}

.section-title {
  font-family: 'Oswald', sans-serif;
  font-size: 1.3rem;
  color: var(--navy);
  margin-bottom: 20px;
}

.form-grid {
  display: grid;
  gap: 16px;
  margin-bottom: 24px;
}

@media (min-width: 768px) {
  .form-grid {
    grid-template-columns: repeat(3, 1fr);
  }
}

.form-group {
  display: flex;
  flex-direction: column;
}

label {
  font-weight: 500;
  margin-bottom: 8px;
  color: var(--text);
  font-size: 0.9rem;
}

input, select, textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 1rem;
  background: var(--bg);
  color: var(--text);
  font-family: inherit;
}

textarea {
  resize: vertical;
  min-height: 80px;
}

input:focus, select:focus, textarea:focus {
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.full-width {
  grid-column: 1 / -1;
}

button {
  background: var(--navy);
  color: white;
  border: none;
  padding: 14px 28px;
  border-radius: 8px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  font-family: 'Oswald', sans-serif;
  letter-spacing: 0.5px;
  transition: background 0.2s;
}

button:hover {
  background: var(--teal);
}

button:active {
  transform: scale(0.98);
}

.btn-secondary {
  background: transparent;
  color: var(--navy);
  border: 1px solid var(--border);
}

.btn-secondary:hover {
  background: var(--border);
  color: var(--text);
}

.btn-small {
  padding: 8px 16px;
  font-size: 0.9rem;
}

.stats-grid {
  display: grid;
  gap: 16px;
  margin-bottom: 24px;
}

@media (min-width: 640px) {
  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (min-width: 768px) {
  .stats-grid {
    grid-template-columns: repeat(4, 1fr);
  }
}

.stat-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  text-align: center;
}

.stat-label {
  font-size: 0.85rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: 500;
  margin-bottom: 8px;
}

.stat-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 2rem;
  font-weight: 700;
  color: var(--amber);
  font-variant-numeric: tabular-nums;
}

.stat-unit {
  font-size: 1rem;
  color: var(--text-muted);
  margin-left: 4px;
}

.chart-container {
  position: relative;
  height: 300px;
  margin-bottom: 24px;
}

.sessions-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.session-item {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  display: grid;
  gap: 12px;
}

@media (min-width: 640px) {
  .session-item {
    grid-template-columns: 100px 120px 1fr 80px;
    align-items: center;
  }
}

.session-date {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 600;
  color: var(--text);
  font-size: 0.9rem;
}

.session-type {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 6px;
  font-weight: 600;
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

.type-carrera { background: var(--teal); color: white; }
.type-intervalos { background: #ef4444; color: white; }
.type-tempo { background: var(--amber); color: white; }
.type-fuerza { background: #8b5cf6; color: white; }
.type-recuperacion { background: var(--slate); color: white; }

.session-details {
  display: flex;
  gap: 16px;
  font-size: 0.9rem;
  color: var(--text-muted);
}

.session-metric {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 600;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}

.session-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}

.btn-icon {
  background: transparent;
  color: var(--text-muted);
  padding: 4px 8px;
  font-size: 1.2rem;
  border: 1px solid var(--border);
  min-width: 36px;
}

.btn-icon:hover {
  background: var(--border);
  color: var(--text);
}

.btn-danger {
  color: #ef4444;
}

.btn-danger:hover {
  background: #fee2e2;
  color: #dc2626;
}

.controls {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 24px;
}

.empty-state {
  text-align: center;
  padding: 48px 24px;
  color: var(--text-muted);
}

.empty-state-icon {
  font-size: 3rem;
  margin-bottom: 16px;
}

footer {
  margin-top: 48px;
  padding-top: 24px;
  border-top: 1px solid var(--border);
  text-align: center;
  color: var(--text-muted);
  font-size: 0.85rem;
}

footer strong {
  color: var(--navy);
  font-weight: 600;
}
</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap">

<div class="container">
  <h1>Bitácora de Entrenamiento</h1>
  <p class="subtitle">Registra y analiza tu progreso con métricas visuales</p>

  <div class="card">
    <h2 class="section-title">Registrar Sesión</h2>
    <form id="sessionForm">
      <div class="form-grid">
        <div class="form-group">
          <label for="date">Fecha</label>
          <input type="date" id="date" required>
        </div>
        <div class="form-group">
          <label for="type">Tipo de Sesión</label>
          <select id="type" required>
            <option value="">Selecciona...</option>
            <option value="carrera">Carrera Continua</option>
            <option value="intervalos">Intervalos</option>
            <option value="tempo">Tempo</option>
            <option value="fuerza">Fuerza/Cuestas</option>
            <option value="recuperacion">Recuperación</option>
          </select>
        </div>
        <div class="form-group">
          <label for="duration">Duración (min)</label>
          <input type="number" id="duration" min="5" max="300" required placeholder="45">
        </div>
        <div class="form-group">
          <label for="distance">Distancia (km)</label>
          <input type="number" id="distance" step="0.1" min="0" max="100" placeholder="7.5">
        </div>
        <div class="form-group">
          <label for="rpe">RPE (1-10)</label>
          <input type="number" id="rpe" min="1" max="10" required placeholder="7">
        </div>
        <div class="form-group">
          <label for="avgHr">FC Promedio (opcional)</label>
          <input type="number" id="avgHr" min="50" max="220" placeholder="155">
        </div>
        <div class="form-group full-width">
          <label for="notes">Notas</label>
          <textarea id="notes" placeholder="¿Cómo te sentiste? Condiciones climáticas, equipo, etc."></textarea>
        </div>
      </div>
      <button type="submit">GUARDAR SESIÓN</button>
    </form>
  </div>

  <div id="statsSection" class="card" hidden>
    <h2 class="section-title">Resumen Últimas 4 Semanas</h2>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Sesiones</div>
        <div class="stat-value" id="statSessions">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Volumen Total</div>
        <div>
          <span class="stat-value" id="statVolume">0</span>
          <span class="stat-unit">km</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Tiempo Total</div>
        <div>
          <span class="stat-value" id="statTime">0</span>
          <span class="stat-unit">h</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-label">RPE Promedio</div>
        <div>
          <span class="stat-value" id="statRpe">0</span>
          <span class="stat-unit">/10</span>
        </div>
      </div>
    </div>
  </div>

  <div id="chartsSection" class="card" hidden>
    <h2 class="section-title">Volumen Semanal</h2>
    <div class="chart-container">
      <canvas id="volumeChart"></canvas>
    </div>
  </div>

  <div id="sessionsSection" class="card" hidden>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h2 class="section-title" style="margin: 0;">Historial de Sesiones</h2>
      <div class="controls">
        <button id="exportJSON" class="btn-secondary btn-small">📥 Exportar</button>
        <button id="importJSON" class="btn-secondary btn-small">📤 Importar</button>
        <input type="file" id="fileInput" accept=".json" hidden>
      </div>
    </div>
    <div id="sessionsList" class="sessions-list"></div>
  </div>
</div>

<footer>
  <strong>A Tu Marca</strong> — Coaching para corredores 35+ por Ruben Ramírez
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>

<script>
(function() {
  'use strict';

  const form = document.getElementById('sessionForm');
  const dateInput = document.getElementById('date');
  const statsSection = document.getElementById('statsSection');
  const chartsSection = document.getElementById('chartsSection');
  const sessionsSection = document.getElementById('sessionsSection');
  const sessionsList = document.getElementById('sessionsList');
  const exportBtn = document.getElementById('exportJSON');
  const importBtn = document.getElementById('importJSON');
  const fileInput = document.getElementById('fileInput');

  let sessions = [];
  let volumeChart = null;

  // Set today's date as default
  dateInput.valueAsDate = new Date();

  function loadSessions() {
    try {
      const stored = localStorage.getItem('trainingSessions');
      sessions = stored ? JSON.parse(stored) : [];
      sessions.sort((a, b) => new Date(b.date) - new Date(a.date));
    } catch (e) {
      console.warn('Could not load sessions:', e);
      sessions = [];
    }
  }

  function saveSessions() {
    try {
      localStorage.setItem('trainingSessions', JSON.stringify(sessions));
    } catch (e) {
      console.warn('Could not save sessions:', e);
    }
  }

  function addSession(sessionData) {
    sessions.unshift(sessionData);
    saveSessions();
    render();
  }

  function deleteSession(id) {
    sessions = sessions.filter(s => s.id !== id);
    saveSessions();
    render();
  }

  function calculateStats() {
    const fourWeeksAgo = new Date();
    fourWeeksAgo.setDate(fourWeeksAgo.getDate() - 28);

    const recentSessions = sessions.filter(s => new Date(s.date) >= fourWeeksAgo);

    const totalSessions = recentSessions.length;
    const totalVolume = recentSessions.reduce((sum, s) => sum + (s.distance || 0), 0);
    const totalTime = recentSessions.reduce((sum, s) => sum + s.duration, 0);
    const avgRpe = totalSessions > 0
      ? recentSessions.reduce((sum, s) => sum + s.rpe, 0) / totalSessions
      : 0;

    return {
      sessions: totalSessions,
      volume: totalVolume.toFixed(1),
      time: (totalTime / 60).toFixed(1),
      rpe: avgRpe.toFixed(1)
    };
  }

  function getWeeklyData() {
    const weeks = [];
    const today = new Date();

    for (let i = 7; i >= 0; i--) {
      const weekStart = new Date(today);
      weekStart.setDate(today.getDate() - (i * 7) - today.getDay());
      weekStart.setHours(0, 0, 0, 0);

      const weekEnd = new Date(weekStart);
      weekEnd.setDate(weekStart.getDate() + 6);
      weekEnd.setHours(23, 59, 59, 999);

      const weekSessions = sessions.filter(s => {
        const sessionDate = new Date(s.date);
        return sessionDate >= weekStart && sessionDate <= weekEnd;
      });

      const weekVolume = weekSessions.reduce((sum, s) => sum + (s.distance || 0), 0);

      weeks.push({
        label: `${weekStart.getDate()}/${weekStart.getMonth() + 1}`,
        volume: weekVolume
      });
    }

    return weeks;
  }

  function renderStats() {
    const stats = calculateStats();
    document.getElementById('statSessions').textContent = stats.sessions;
    document.getElementById('statVolume').textContent = stats.volume;
    document.getElementById('statTime').textContent = stats.time;
    document.getElementById('statRpe').textContent = stats.rpe;

    statsSection.hidden = sessions.length === 0;
  }

  function renderChart() {
    const weeklyData = getWeeklyData();
    const canvas = document.getElementById('volumeChart');
    const ctx = canvas.getContext('2d');

    if (volumeChart) {
      volumeChart.destroy();
    }

    const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const textColor = isDark ? '#94a3b8' : '#64748b';
    const gridColor = isDark ? '#334155' : '#e2e8f0';

    volumeChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: weeklyData.map(w => w.label),
        datasets: [{
          label: 'km por semana',
          data: weeklyData.map(w => w.volume),
          backgroundColor: '#14b8a6',
          borderRadius: 4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            display: false
          },
          tooltip: {
            backgroundColor: isDark ? '#1e293b' : '#ffffff',
            titleColor: isDark ? '#f1f5f9' : '#1e293b',
            bodyColor: isDark ? '#f1f5f9' : '#1e293b',
            borderColor: isDark ? '#334155' : '#e2e8f0',
            borderWidth: 1,
            callbacks: {
              label: function(context) {
                return context.parsed.y.toFixed(1) + ' km';
              }
            }
          }
        },
        scales: {
          y: {
            beginAtZero: true,
            ticks: {
              color: textColor,
              callback: function(value) {
                return value + ' km';
              }
            },
            grid: {
              color: gridColor
            }
          },
          x: {
            ticks: {
              color: textColor
            },
            grid: {
              display: false
            }
          }
        }
      }
    });

    chartsSection.hidden = sessions.length === 0;
  }

  function renderSessions() {
    if (sessions.length === 0) {
      sessionsSection.hidden = true;
      return;
    }

    sessionsSection.hidden = false;

    sessionsList.innerHTML = sessions.map(session => `
      <div class="session-item">
        <div class="session-date">${new Date(session.date).toLocaleDateString('es-MX', {
          day: '2-digit',
          month: 'short'
        })}</div>
        <div>
          <span class="session-type type-${session.type}">${session.typeName}</span>
        </div>
        <div class="session-details">
          <div>
            <span class="session-metric">${session.duration}</span> min
          </div>
          ${session.distance ? `
            <div>
              <span class="session-metric">${session.distance}</span> km
            </div>
          ` : ''}
          <div>
            RPE <span class="session-metric">${session.rpe}</span>/10
          </div>
          ${session.avgHr ? `
            <div>
              FC <span class="session-metric">${session.avgHr}</span>
            </div>
          ` : ''}
        </div>
        <div class="session-actions">
          <button class="btn-icon btn-danger" onclick="deleteSessionById('${session.id}')" title="Eliminar">🗑</button>
        </div>
      </div>
      ${session.notes ? `
        <div style="grid-column: 1/-1; padding: 8px 16px; background: var(--bg); border-radius: 4px; font-size: 0.9rem; color: var(--text-muted); margin-top: -8px;">
          ${session.notes}
        </div>
      ` : ''}
    `).join('');
  }

  function render() {
    renderStats();
    renderChart();
    renderSessions();
  }

  // Make deleteSessionById available globally
  window.deleteSessionById = function(id) {
    if (confirm('¿Eliminar esta sesión?')) {
      deleteSession(id);
    }
  };

  form.addEventListener('submit', function(e) {
    e.preventDefault();

    const typeNames = {
      carrera: 'Carrera',
      intervalos: 'Intervalos',
      tempo: 'Tempo',
      fuerza: 'Fuerza',
      recuperacion: 'Recuperación'
    };

    const sessionData = {
      id: Date.now().toString(),
      date: document.getElementById('date').value,
      type: document.getElementById('type').value,
      typeName: typeNames[document.getElementById('type').value],
      duration: parseInt(document.getElementById('duration').value),
      distance: parseFloat(document.getElementById('distance').value) || null,
      rpe: parseInt(document.getElementById('rpe').value),
      avgHr: parseInt(document.getElementById('avgHr').value) || null,
      notes: document.getElementById('notes').value.trim() || null
    };

    addSession(sessionData);
    form.reset();
    dateInput.valueAsDate = new Date();
  });

  exportBtn.addEventListener('click', function() {
    const dataStr = JSON.stringify(sessions, null, 2);
    const blob = new Blob([dataStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `bitacora-${new Date().toISOString().split('T')[0]}.json`;
    a.click();
    URL.revokeObjectURL(url);
  });

  importBtn.addEventListener('click', function() {
    fileInput.click();
  });

  fileInput.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(event) {
      try {
        const imported = JSON.parse(event.target.result);
        if (Array.isArray(imported)) {
          sessions = imported;
          saveSessions();
          render();
          alert(`Importadas ${imported.length} sesiones exitosamente`);
        }
      } catch (err) {
        alert('Error al importar: archivo JSON inválido');
      }
    };
    reader.readAsText(file);
    fileInput.value = '';
  });

  // Listen for theme changes
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', renderChart);

  loadSessions();
  render();
})();
</script>
