<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Runners Sin Edad - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Inter:wght@400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0a192f;
            --charcoal: #112240;
            --amber: #ffbf00; /* Fuerza */
            --teal: #00ced1;   /* Carrera */
            --slate: #8892b0;
        }
        body {
            background-color: var(--navy);
            color: white;
            font-family: 'Inter', sans-serif;
        }
        h1, h2, h3 {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
        }
        .metric-font {
            font-family: 'JetBrains Mono', monospace;
        }
        .card {
            background-color: var(--charcoal);
            border: 1px solid #233554;
        }
        .progress-bar-bg {
            background-color: #233554;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            transition: width 0.5s ease;
        }
        .phase-base { background-color: var(--teal); }
        .phase-strength { background-color: var(--amber); }
        .phase-speed { background-color: #ff4500; }
        .phase-taper { background-color: #adff2f; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-4xl font-bold text-white">Runners <span class="text-teal-400">Sin Edad</span></h1>
                <p class="text-slate-400">Plan Personalizado | Coach Ruben Ramírez</p>
            </div>
            <div class="text-right">
                <div id="current-date" class="metric-font text-sm text-slate-400"></div>
                <div id="member-name" class="text-xl font-semibold">Cargando...</div>
            </div>
        </header>

        <!-- Phase Tracker -->
        <section class="mb-10">
            <h2 class="text-xl mb-4 flex items-center">
                <span class="mr-2">🏃</span> Estado de Periodización
            </h2>
            <div class="grid grid-cols-4 gap-2 mb-2">
                <div class="text-center text-xs uppercase font-bold text-slate-500">Base</div>
                <div class="text-center text-xs uppercase font-bold text-slate-500">Fuerza</div>
                <div class="text-center text-xs uppercase font-bold text-slate-500">Velocidad</div>
                <div class="text-center text-xs uppercase font-bold text-slate-500">Taper</div>
            </div>
            <div class="progress-bar-bg w-full">
                <div id="phase-progress" class="progress-bar-fill phase-base" style="width: 25%"></div>
            </div>
            <p id="phase-desc" class="text-sm text-slate-400 mt-2 italic text-center">Construyendo la base aeróbica...</p>
        </section>

        <!-- Main Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

            <!-- Today's Workout -->
            <div class="md:col-span-2 card p-6 rounded-xl shadow-xl">
                <h3 class="text-2xl mb-4 text-teal-400">Entrenamiento de Hoy</h3>
                <div id="workout-card" class="space-y-4">
                    <div class="bg-navy p-4 rounded-lg border border-slate-700">
                        <p id="workout-desc" class="text-lg font-medium">Cargando sesión...</p>
                        <div class="flex justify-between items-center mt-4">
                            <span class="text-xs uppercase text-slate-500">RPE Objetivo: <span id="target-rpe" class="metric-font text-white">--</span></span>
                            <span id="workout-status" class="text-xs px-2 py-1 rounded bg-slate-800 text-slate-400">Pendiente</span>
                        </div>
                    </div>

                    <!-- Completion Form -->
                    <div id="completion-form" class="pt-4 border-t border-slate-800 hidden">
                        <p class="text-sm mb-2 text-slate-400">¿Cómo sentiste la sesión? (RPE Real 1-10)</p>
                        <div class="flex gap-3">
                            <input type="number" id="actual-rpe" min="1" max="10" class="bg-navy border border-slate-700 text-white p-2 rounded w-20 metric-font" placeholder="RPE">
                            <button onclick="submitWorkout()" class="bg-teal-500 hover:bg-teal-600 text-navy font-bold py-2 px-4 rounded transition-colors">
                                Registrar Sesión
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Diagnostics -->
            <div class="card p-6 rounded-xl shadow-xl">
                <h3 class="text-xl mb-4 text-amber-400">Diagnósticos</h3>
                <div id="metrics-list" class="space-y-3">
                    <!-- Metric items injected here -->
                </div>
                <button onclick="exportData()" class="w-full mt-6 text-xs text-slate-500 hover:text-white transition-colors uppercase font-bold">
                    Exportar JSON para Coach
                </button>
            </div>

        </div>
    </div>

    <script>
        // --- Mock Data for Demo (Can be connected to FastAPI) ---
        const MOCK_MEMBER = {
            id: "m1",
            name: "Ruben Runner",
            current_phase: "Base",
            metrics: [
                { name: "VO2max", value: 42.5, unit: "ml/kg/min" },
                { name: "Cooper", value: 2100, unit: "m" }
            ],
            workouts: [
                { id: "w1", date: "2023-10-23", description: "Trote suave 40min + Movilidad", target_rpe: 4, completed: false }
            ]
        };

        function init() {
            document.getElementById('current-date').innerText = new Date().toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            document.getElementById('member-name').innerText = MOCK_MEMBER.name;

            renderPhase(MOCK_MEMBER.current_phase);
            renderMetrics(MOCK_MEMBER.metrics);
            renderWorkout(MOCK_MEMBER.workouts[0]);
        }

        function renderPhase(phase) {
            const progress = document.getElementById('phase-progress');
            const desc = document.getElementById('phase-desc');

            const phases = {
                "Base": { width: "25%", class: "phase-base", text: "Construyendo la base aeróbica..." },
                "Fuerza": { width: "50%", class: "phase-strength", text: "Incrementando la potencia muscular..." },
                "Velocidad": { width: "75%", class: "phase-speed", text: "Afinando el ritmo de carrera..." },
                "Taper": { width: "100%", class: "phase-taper", text: "Recuperación final para el objetivo." }
            };

            const config = phases[phase] || phases["Base"];
            progress.style.width = config.width;
            progress.className = `progress-bar-fill ${config.class}`;
            desc.innerText = config.text;
        }

        function renderMetrics(metrics) {
            const container = document.getElementById('metrics-list');
            container.innerHTML = metrics.map(m => `
                <div class="flex justify-between items-center p-2 bg-navy rounded border border-slate-800">
                    <span class="text-sm text-slate-400">${m.name}</span>
                    <span class="metric-font text-amber-400 font-bold">${m.value} <small class="text-[10px]">${m.unit}</small></span>
                </div>
            `).join('');
        }

        function renderWorkout(workout) {
            document.getElementById('workout-desc').innerText = workout.description;
            document.getElementById('target-rpe').innerText = workout.target_rpe;

            if (workout.completed) {
                document.getElementById('workout-status').innerText = "Completado";
                document.getElementById('workout-status').className = "text-xs px-2 py-1 rounded bg-green-900 text-green-300";
                document.getElementById('completion-form').classList.add('hidden');
            } else {
                document.getElementById('completion-form').classList.add('block'); // Simplified for demo
                // Note: in real app, this would be controlled by workout.completed
            }
        }

        function submitWorkout() {
            const rpe = document.getElementById('actual-rpe').value;
            if (!rpe || rpe < 1 || rpe > 10) {
                alert("Por favor ingresa un RPE válido (1-10)");
                return;
            }
            alert(`Sesión registrada con RPE ${rpe}. ¡Buen trabajo!`);
            // Here we would call the FastAPI endpoint: PATCH /members/{id}/workouts/{id}
        }

        function exportData() {
            const data = JSON.stringify(MOCK_MEMBER, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `member_${MOCK_MEMBER.id}_progress.json`;
            a.click();
        }

        init();
    </script>
</body>
</html>
